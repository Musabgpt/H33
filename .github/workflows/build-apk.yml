name: Build H33 DeepSeek Coder GGUF APK

on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: Include full model (disable only for future small updates)
        required: true
        type: boolean
        default: true
  push:
    branches: ['h33-deepseek-lite']

concurrency:
  group: h33-deepseek-gguf-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Cache is repository-scoped. This full build establishes the identity;
      # subsequent small APKs restore it and Android accepts them as updates.
      - name: Restore stable signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h33-android-debug-signing-v1

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch pinned llama.cpp runtime
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp checkout ce8caa6e60a03093351d6016a818720e0d46f0fb

      - name: Compile optimized Android runtime before model conversion
        run: gradle :app:externalNativeBuildDebug :app:compileDebugJavaWithJavac --stacktrace

      - name: Set up Python
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_model }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GGUF conversion toolchain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_model }}
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          pip install -r app/src/main/cpp/llama.cpp/requirements.txt

      - name: Convert official DeepSeek Coder to GGUF Q4_K_M
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_model }}
        run: |
          hf download deepseek-ai/deepseek-coder-1.3b-instruct \
            --local-dir /tmp/deepseek-hf
          python app/src/main/cpp/llama.cpp/convert_hf_to_gguf.py /tmp/deepseek-hf \
            --outfile /tmp/deepseek-f16.gguf --outtype f16
          cmake -S app/src/main/cpp/llama.cpp -B /tmp/llama-host \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-host --target llama-quantize --parallel 2
          mkdir -p app/src/main/assets/model
          /tmp/llama-host/bin/llama-quantize /tmp/deepseek-f16.gguf \
            app/src/main/assets/model/deepseek-coder-1.3b-q4_k_m.gguf Q4_K_M

      - name: Validate full model
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_model }}
        run: |
          MODEL=app/src/main/assets/model/deepseek-coder-1.3b-q4_k_m.gguf
          test -s "$MODEL"
          test "$(head -c4 "$MODEL")" = "GGUF"
          test "$(stat -c%s "$MODEL")" -gt 450000000
          du -h "$MODEL"

      - name: Prepare model-free update
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.bundle_model) }}
        run: mkdir -p app/src/main/assets/model

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee apk.sha256
          unzip -l "$APK" | tee apk-files.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/.*h33_llama.*\.so'
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then exit 1; fi
          echo "APK bytes: $(stat -c%s "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H33-DeepSeek-Coder-GGUF-${{ (github.event_name == 'push' || !inputs.bundle_model) && 'UPDATE' || 'FULL' }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
            apk-files.txt
          compression-level: 0
          retention-days: 7
