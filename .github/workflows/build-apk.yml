name: Build H33 Native GGUF APK

on:
  workflow_dispatch:
  push:
    branches: [qwen2.5-mobile, 'h33-*']

concurrency:
  group: h33-native-gguf-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      LLAMA_CPP_COMMIT: 335b21fcbda972777e4e9e69decad1f719cafeb3
      NDK_VERSION: 29.0.14206865

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.31.6"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch pinned llama.cpp
        run: |
          git init third_party/llama.cpp
          git -C third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C third_party/llama.cpp fetch --depth 1 origin "${LLAMA_CPP_COMMIT}"
          git -C third_party/llama.cpp checkout --detach "${LLAMA_CPP_COMMIT}"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "${LLAMA_CPP_COMMIT}"
          git -C third_party/llama.cpp status --short

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build native GGUF APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Static APK audit
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee apk.sha256
          unzip -l "$APK" | tee apk-files.txt
          if unzip -l "$APK" | grep -E 'onnx|onnxruntime|genai_config|\.model$'; then
            echo "Forbidden legacy ORT/model assets found in APK"
            exit 1
          fi
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then
            echo "Unexpected 32-bit native libraries"
            exit 1
          fi
          unzip -l "$APK" | grep 'lib/arm64-v8a/.*\.so' || true
          echo "APK bytes: $(stat -c%s "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H33-Native-GGUF-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
            apk-files.txt
          compression-level: 0
          retention-days: 7
