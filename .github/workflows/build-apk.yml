name: Build H33 DeepSeek Coder GGUF APK

on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: Include full model (disable only for future small updates)
        required: true
        type: boolean
        default: true
  push:
    branches: ['h33-deepseek-lite']

concurrency:
  group: h33-deepseek-gguf-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'


      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch pinned llama.cpp runtime
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp checkout ce8caa6e60a03093351d6016a818720e0d46f0fb

      - name: Compile optimized Android runtime before model conversion
        run: gradle :app:externalNativeBuildDebug :app:compileDebugJavaWithJavac --stacktrace

      - name: Set up Python
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.bundle_model) || contains(github.event.head_commit.message, '[full]') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GGUF conversion toolchain
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.bundle_model) || contains(github.event.head_commit.message, '[full]') }}
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          pip install -r app/src/main/cpp/llama.cpp/requirements.txt

      - name: Convert official DeepSeek Coder to GGUF Q4_K_M
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.bundle_model) || contains(github.event.head_commit.message, '[full]') }}
        run: |
          hf download deepseek-ai/deepseek-coder-1.3b-instruct \
            --local-dir /tmp/deepseek-hf
          python app/src/main/cpp/llama.cpp/convert_hf_to_gguf.py /tmp/deepseek-hf \
            --outfile /tmp/deepseek-f16.gguf --outtype f16
          cmake -S app/src/main/cpp/llama.cpp -B /tmp/llama-host \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-host --target llama-quantize --parallel 2
          mkdir -p app/src/main/assets/model
          /tmp/llama-host/bin/llama-quantize /tmp/deepseek-f16.gguf \
            app/src/main/assets/model/deepseek-coder-1.3b-q3_k_s.gguf Q3_K_S

      - name: Smoke-test GGUF before packaging
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.bundle_model) || contains(github.event.head_commit.message, '[full]') }}
        run: |
          cmake --build /tmp/llama-host --target llama-cli --parallel 2
          MODEL=app/src/main/assets/model/deepseek-coder-1.3b-q3_k_s.gguf
          timeout 45s /tmp/llama-host/bin/llama-cli -m "$MODEL" -p "Hi" -n 8 -c 256 -t 4 --no-display-prompt 2>&1 | tee smoke.txt
          grep -Eiq '[[:alpha:]]{2,}' smoke.txt
          echo "GGUF inference smoke test passed"

      - name: Validate full model
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.bundle_model) || contains(github.event.head_commit.message, '[full]') }}
        run: |
          MODEL=app/src/main/assets/model/deepseek-coder-1.3b-q3_k_s.gguf
          test -s "$MODEL"
          test "$(head -c4 "$MODEL")" = "GGUF"
          test "$(stat -c%s "$MODEL")" -gt 350000000
          du -h "$MODEL"

      - name: Prepare model-free update
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[full]')) || (github.event_name == 'workflow_dispatch' && !inputs.bundle_model) }}
        run: mkdir -p app/src/main/assets/model

      - name: Create deterministic H33 update signing key
        run: |
          rm -f "$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=H33 Update,O=Musabgpt,C=GB" \
            -J-Duser.language=en -J-Duser.country=US
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | tee h33-key.txt

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee apk.sha256
          unzip -l "$APK" | tee apk-files.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/.*h33_llama.*\.so'
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then exit 1; fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          echo "APK bytes: $(stat -c%s "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H33-DeepSeek-Coder-GGUF-${{ ((github.event_name == 'workflow_dispatch' && inputs.bundle_model) || contains(github.event.head_commit.message, '[full]')) && 'FULL' || 'UPDATE' }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
            apk-files.txt
            apk-signing.txt
            h33-key.txt
            smoke.txt
          compression-level: 0
          retention-days: 7
