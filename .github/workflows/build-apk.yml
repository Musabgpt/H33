name: Build H33 AraGPT2 Learning APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install model conversion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          pip install "transformers==4.55.4" "optimum-onnx" "safetensors>=0.5" "onnx>=1.17" "onnxruntime>=1.24,<2" "numpy<3" sentencepiece

      - name: Export AraGPT2 with Optimum and quantize
        run: python scripts/export_aragpt2_onnx.py

      - name: Keep preferred model and inspect assets
        run: |
          if [ -f app/src/main/assets/aragpt2.int8.onnx ]; then
            rm -f app/src/main/assets/aragpt2.fp32.onnx
          fi
          ls -lh app/src/main/assets/

      - name: Install Android platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -200
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AraGPT2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 7
