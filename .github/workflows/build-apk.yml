name: Build H33 Colibri-Native DeepSeek APK

on:
  workflow_dispatch:
  push:
    branches: [qwen2.5-mobile, 'h33-*']
concurrency:
  group: h33-colibri-native-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"

      - name: Patch build configuration for native runtime
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.musab.aragpt2"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.musab.aragpt2"
                  minSdk = 28
                  targetSdk = 36
                  versionCode = 6
                  versionName = "0.6.0-colibri-native"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.31.6" } }
              packaging {
                  jniLibs { useLegacyPackaging = false }
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20250517")
          }
          EOF
          rm -f app/libs/onnxruntime-genai.aar

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Static APK audit
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee apk.sha256
          unzip -l "$APK" | tee apk-files.txt
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then exit 1; fi
          if unzip -l "$APK" | grep -q 'onnxruntime'; then
            echo "ORT payload unexpectedly present"
            exit 1
          fi
          unzip -l "$APK" | grep 'lib/arm64-v8a/.*\.so' || true
          echo "APK bytes: $(stat -c%s "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H33-Colibri-Native-DeepSeek-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
            apk-files.txt
          compression-level: 0
          retention-days: 7
