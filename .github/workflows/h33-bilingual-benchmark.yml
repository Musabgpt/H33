name: H33 Bilingual and Judge Benchmark

on:
  workflow_dispatch:
  push:
    branches: [exp-bilingual-eval]
    paths:
      - 'benchmarks/h33_bilingual_benchmark.py'
      - '.github/workflows/h33-bilingual-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          pip install "transformers==5.14.1" "datasets>=4,<5" "huggingface-hub>=1.5,<2" "numpy<2" sentencepiece

      - name: Run real Qwen2.5-0.5B benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_XET: '1'
        run: |
          python benchmarks/h33_bilingual_benchmark.py             --per-domain 8             --judge-cases 160             --out artifacts/h33-bilingual-benchmark | tee artifacts-benchmark.log

      - name: Show benchmark summary
        if: always()
        run: |
          test -f artifacts/h33-bilingual-benchmark/summary.md && cat artifacts/h33-bilingual-benchmark/summary.md || true

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H33-Bilingual-Benchmark
          path: |
            artifacts/h33-bilingual-benchmark/
            artifacts-benchmark.log
          retention-days: 14
