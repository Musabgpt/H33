name: Publish H33 Direct APK

on:
  push:
    branches: [h33-three-candidate-native]
    paths:
      - ".github/workflows/publish-direct-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 35507711431             --repo ${{ github.repository }}             --name H33-Qwen2.5-Android-APK             --dir dist
          APK="$(find dist -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" H33-Qwen2.5-three-candidate.apk

      - name: Verify APK digest
        run: |
          echo "825d2cfe0659d9f8c51dbb26d4ae0de6032b568a896584b8e136b98a81134e17  H33-Qwen2.5-three-candidate.apk" | sha256sum -c -

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="h33-three-candidate-test-20260920"
          gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1             && gh release delete "$TAG" --repo ${{ github.repository }} --yes --cleanup-tag             || true
          gh release create "$TAG"             H33-Qwen2.5-three-candidate.apk             --repo ${{ github.repository }}             --target e96d1a298dede0342388ce5828ead79c0523910b             --title "H33 Three-Candidate Test APK"             --notes "Verified APK from GitHub Actions run 35507711431. SHA-256: 825d2cfe0659d9f8c51dbb26d4ae0de6032b568a896584b8e136b98a81134e17"
